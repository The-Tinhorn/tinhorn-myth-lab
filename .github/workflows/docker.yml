# Every push to main: run the tests, then build the image for PC + Raspberry Pi and publish it to
# ghcr.io/the-tinhorn/tinhorn-myth-lab:latest
name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/the-tinhorn/tinhorn-myth-lab:latest
          labels: org.opencontainers.image.source=https://github.com/The-Tinhorn/tinhorn-myth-lab
