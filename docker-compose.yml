# Myth Lab bot. CasaOS: App Store → "+" → Install a customized app → Import → paste this file.
name: myth-lab
services:
  myth-lab:
    image: ghcr.io/the-tinhorn/tinhorn-myth-lab:latest
    container_name: myth-lab
    restart: unless-stopped
    volumes:
      - /DATA/AppData/myth-lab:/app/data
    environment:
      DISCORD_TOKEN: ""
      GUILD_ID: ""
      STAFF_ROLE_ID: ""
x-casaos:
  architectures: [amd64, arm64, arm]
  main: myth-lab
  author: Tinhorn
  category: Utilities
  title:
    en_us: Myth Lab
  tagline:
    en_us: Discord myth-busting idea pipeline
  description:
    en_us: Submit, review, vote, test and publish community myths for Tinhorn videos.
